<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kash</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#e3e6eb; --ink:#1f2733; --dim:#6b7480;
          --teal:#0f766e; --green:#15803d; --amber:#b45309; --red:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:14px 22px;
           display:flex; align-items:center; gap:14px; }
  header h1 { font-size:18px; margin:0; letter-spacing:.5px; }
  header .sub { color:var(--dim); font-size:12.5px; }
  header .spacer { flex:1; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink);
           padding:7px 14px; border-radius:7px; cursor:pointer; }
  button:hover { border-color:var(--teal); color:var(--teal); }
  main { max-width:1100px; margin:0 auto; padding:22px; }
  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:14px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .tile .n { font-size:24px; font-weight:700; }
  .tile .l { color:var(--dim); font-size:12px; margin-top:2px; }
  .tile.good .n { color:var(--green); }
  .tile.warn .n { color:var(--amber); }
  .strip { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 16px;
           margin-bottom:14px; display:flex; gap:26px; align-items:center; flex-wrap:wrap; }
  .strip b { color:var(--teal); }
  .badge { font-size:12px; padding:3px 9px; border-radius:20px; background:#eaf5ee; color:var(--green); }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:14px; }
  .panel h2 { font-size:13px; margin:0; padding:12px 16px; border-bottom:1px solid var(--line); color:var(--dim);
              text-transform:uppercase; letter-spacing:1px; display:flex; align-items:center; gap:10px; }
  .filters { margin-left:auto; display:flex; gap:6px; }
  .filters button { padding:3px 10px; font-size:12px; }
  .filters button.on { background:var(--teal); color:#fff; border-color:var(--teal); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:9px 16px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:600; font-size:12px; }
  tr:last-child td { border-bottom:none; }
  .pill { font-size:11.5px; padding:2px 9px; border-radius:20px; font-weight:600; white-space:nowrap; }
  .pill.resolved { background:#eaf5ee; color:var(--green); }
  .pill.escalate { background:#fdf0e6; color:var(--amber); }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; color:var(--dim); }
  .ev { color:var(--dim); font-size:12px; }
  .audit { padding:8px 16px; }
  .audit div { padding:5px 0; color:var(--dim); border-bottom:1px dashed var(--line); }
  .audit b { color:var(--ink); }
  #askbar { background:var(--card); border-bottom:1px solid var(--line); padding:10px 22px;
            display:flex; gap:10px; align-items:center; }
  #askbar input { flex:1; max-width:540px; padding:8px 12px; border:1px solid var(--line);
                  border-radius:7px; font:inherit; }
  #ans { color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Kash</h1>
  <span class="sub" id="sub">finance close</span>
  <span class="spacer"></span>
  <button id="run">Run close</button>
</header>
<div id="askbar">
  <input id="q" placeholder="Ask about the close, e.g. what needs review, STL-00007, unresolved value">
  <button id="ask">Ask</button>
  <span id="ans"></span>
</div>
<main id="app"><p style="color:var(--dim)">Loading…</p></main>

<script>
const inr = (x) => "₹" + Math.round(x).toLocaleString("en-IN");
let data = null, filter = "all";

async function runClose() {
  const app = document.getElementById("app");
  app.innerHTML = '<p style="color:var(--dim)">Running close…</p>';
  data = await (await fetch("/report.json", { cache: "no-store" })).json();
  render();
}

function render() {
  const s = data.stats, r = data.resolution, a = data.accuracy;
  document.getElementById("sub").textContent =
    `finance close  ${s.records} records reconciled in ${s.seconds}s`;

  const tiles = `
    <div class="tiles">
      <div class="tile"><div class="n">${s.records}</div><div class="l">records processed</div></div>
      <div class="tile good"><div class="n">${s.reconciled_pct}%</div><div class="l">value reconciled (${inr(s.reconciled_value)})</div></div>
      <div class="tile"><div class="n">${s.exceptions}</div><div class="l">exceptions found</div></div>
      <div class="tile warn"><div class="n">${r.escalated}</div><div class="l">escalated to a human</div></div>
    </div>
    <div class="strip">
      <span>auto-resolved <b>${r.auto_resolved}</b> of ${s.exceptions} (${r.auto_resolution_rate}%)</span>
      <span>escalated value <b>${inr(r.escalated_value)}</b></span>
      <span class="badge">${r.resolved_without_evidence} resolved without evidence</span>
      <span>detection precision <b>${a.precision}</b> · recall <b>${a.recall}</b> · f1 <b>${a.f1}</b></span>
    </div>`;

  const rows = data.exceptions
    .filter(e => filter === "all" || e.status === filter)
    .map(e => `
      <tr>
        <td>${e.type}</td>
        <td class="mono">${e.ref}</td>
        <td>${inr(e.amount)}</td>
        <td><span class="pill ${e.status}">${e.status === "resolved" ? "resolved" : "review"}</span></td>
        <td>${Math.round(e.confidence * 100)}%</td>
        <td>${e.resolution || e.reason}<div class="ev">evidence: ${e.evidence.join(", ") || "-"}</div></td>
      </tr>`).join("");

  const table = `
    <div class="panel">
      <h2>Exceptions
        <span class="filters">
          <button data-f="all" class="${filter==='all'?'on':''}">all</button>
          <button data-f="escalate" class="${filter==='escalate'?'on':''}">to review</button>
          <button data-f="resolved" class="${filter==='resolved'?'on':''}">auto-resolved</button>
        </span>
      </h2>
      <table>
        <thead><tr><th>Type</th><th>Reference</th><th>Amount</th><th>Status</th><th>Conf.</th><th>Reason &amp; evidence</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

  const c = data.confusion;
  const matrix = `
    <div class="panel">
      <h2>Detection vs ground truth (${c.population} checkable records)</h2>
      <table style="max-width:440px">
        <thead><tr><th></th><th>actual: problem</th><th>actual: clean</th></tr></thead>
        <tbody>
          <tr><th>flagged</th><td>${c.tp}</td><td>${c.fp}</td></tr>
          <tr><th>not flagged</th><td>${c.fn}</td><td>${c.tn}</td></tr>
        </tbody>
      </table>
    </div>`;

  const audit = `
    <div class="panel">
      <h2>Audit trail</h2>
      <div class="audit">${data.audit.map(x => `<div><b>${x.step}</b> &mdash; ${x.detail}</div>`).join("")}</div>
    </div>`;

  document.getElementById("app").innerHTML = tiles + table + matrix + audit;
  document.querySelectorAll(".filters button").forEach(b =>
    b.onclick = () => { filter = b.dataset.f; render(); });
}

async function ask() {
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  const ans = document.getElementById("ans");
  ans.textContent = "…";
  const r = await (await fetch("/ask?q=" + encodeURIComponent(q))).json();
  ans.textContent = r.answer;
}
document.getElementById("ask").onclick = ask;
document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
document.getElementById("run").onclick = runClose;
runClose();
</script>
</body>
</html>
